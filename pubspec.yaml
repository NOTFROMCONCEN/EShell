name: eshell
description: "EShell — a Material You SSH terminal client."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.3.0
  dynamic_color: ^1.7.0
  ffi: ^2.1.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  window_manager: ^0.4.0
  xterm: ^4.0.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
